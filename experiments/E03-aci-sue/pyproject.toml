[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "agentproof-e03-aci"
version = "0.1.0"
description = "E03 tool adapters and SLACT augmentation for mini-swe-agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mini-swe-agent==2.4.6",
    "anyio>=4.4,<5",
]

[project.optional-dependencies]
research = ["swebench", "litellm[mcp]>=1.85,<2", "datasets>=3,<5"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["e03_aci*"]

[tool.uv.sources]
mini-swe-agent = {path = "external/mini-swe-agent", editable = true}
swebench = {path = "external/SWE-bench", editable = true}

[dependency-groups]
dev = ["pytest>=9.0.2", "pytest-asyncio>=1.3.0", "pytest-cov>=7.0.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slow: marks tests as slow"]
