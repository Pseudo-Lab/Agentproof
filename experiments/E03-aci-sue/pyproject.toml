[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-swe-agent"
dynamic = ["version"]
description = "ACI-Lens research checkout of mini-swe-agent"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE.md"}
dependencies = [
    "pyyaml", "requests", "jinja2", "pydantic>=2.0",
    "litellm>=1.75.5,!=1.82.7,!=1.82.8", "tenacity", "rich",
    "python-dotenv", "typer", "platformdirs", "textual",
    "prompt_toolkit", "datasets", "openai!=1.100.0,!=1.100.1",
]

[project.optional-dependencies]
research = ["swebench", "anyio>=4.4,<5", "litellm[mcp]>=1.85,<2", "datasets>=3,<5"]

[project.scripts]
mini = "minisweagent.run.mini:app"
mini-swe-agent = "minisweagent.run.mini:app"
mini-extra = "minisweagent.run.utilities.mini_extra:main"
mini-e = "minisweagent.run.utilities.mini_extra:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.dynamic]
version = {attr = "minisweagent.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["minisweagent*"]

[tool.setuptools.package-data]
minisweagent = ["config/**/*"]

[tool.uv.sources]
swebench = {path = "external/SWE-bench", editable = true}

[dependency-groups]
dev = ["pytest>=9.0.2", "pytest-asyncio>=1.3.0", "pytest-cov>=7.0.0"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = ["slow: marks tests as slow"]
