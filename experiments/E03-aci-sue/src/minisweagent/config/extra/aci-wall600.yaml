# Native limits. Use python -m minisweagent.run.benchmarks.aci for strict cancellation and patch recovery.
# Setup, patch recovery and evaluation are outside the 600 seconds of agent work.
# Native zero values disable request-count and cost ceilings; counts remain recorded.
agent:
  step_limit: 0
  cost_limit: 0
  wall_time_limit_seconds: 600
model:
  model_class: minisweagent.run.benchmarks.aci.DeadlineModel
