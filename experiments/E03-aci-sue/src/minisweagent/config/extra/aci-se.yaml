# Only selected tool sources are mounted. Prompt blocks follow the same flags.
environment:
  env:
    ACI_TOOL_S: '1'
    ACI_TOOL_U: '0'
    ACI_TOOL_E: '1'
  run_args:
  - --rm
  - --mount
  - type=bind,src=./.cache/aci-bin/uv,target=/usr/local/bin/uv,readonly
  - --mount
  - type=bind,src=./tools/search,target=/opt/aci-tools/search,readonly
  - --mount
  - type=bind,src=./tools/editing,target=/opt/aci-tools/editing,readonly
