# S' = aci-s.yaml with the improved dispatch (lenient routing + exact->fuzzy) mounted over
# the original tools/search/search_dispatch.py. Upstream AutoCodeRover code is unchanged.
environment:
  env:
    ACI_TOOL_S: '1'
    ACI_TOOL_U: '0'
    ACI_TOOL_E: '0'
  run_args:
  - --rm
  - --mount
  - type=bind,src=./.cache/aci-bin/uv,target=/usr/local/bin/uv,readonly
  - --mount
  - type=bind,src=./tools/search,target=/opt/aci-tools/search,readonly
  - --mount
  - type=bind,src=./tools/search-improved/search_dispatch.py,target=/opt/aci-tools/search/search_dispatch.py,readonly
