# PUSH = G + V': the environment shows what the model would otherwise spend turns to fetch, on the shell
# commands it already uses (docs/push-aci.md). Baseline flags and prompt; nothing new to call.
# - G   grep output: definitions first, compressed (tools/slcat/search-grep)
# - V'  an edit to repository source: its existing tests run in the background, and new failures (passing
#       on the base commit) come before a later command's output (tools/slcat/edit-diff/related_tests.py)
# U' and E''s diff report are left out: on the vmini50 dev full-solve they did not help (U' 28, E' 30, B 30).
# run_args replace rather than merge, so the mounts of both are listed here.
environment:
  env:
    ACI_TOOL_S: '0'
    ACI_TOOL_U: '0'
    ACI_TOOL_E: '0'
    BASH_ENV: /root/aci-tools/edit-diff/hook.sh
    ACI_NEXT_BASH_ENV: /root/.bashrc   # swebench.yaml's BASH_ENV, run first by hook.sh
    ACI_EDIT_DIFF: '0'
    ACI_EDIT_TESTS: '1'
  run_args:
  - --rm
  - --mount
  - type=bind,src=./.cache/aci-bin/uv,target=/usr/local/bin/uv,readonly
  - --mount
  - type=bind,src=./tools/slcat/search-grep,target=/opt/aci-tools/search-grep,readonly
  - --mount
  - type=bind,src=./tools/slcat/edit-diff,target=/opt/aci-tools/edit-diff,readonly
  - --mount
  - type=bind,src=./external/auto-code-rover,target=/opt/aci-acr,readonly
