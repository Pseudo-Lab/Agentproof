agent:
  system_template: |
    You are a helpful assistant that can interact with a computer shell to solve programming tasks.
    {% if env.ACI_TOOL_U == '1' %}
    Code reading command: readCode PATH [--selector NAME] [--line-start N --line-end M].
    Call it through the bash tool. This is CodeStruct's reader with its documented UTF-8 fix.
    {% if env.ACI_TOOL_POLICY == 'tool_first' %}
    For reading repository code, first call readCode PATH without a selector or line range.
    If it returns only signatures, request the needed function/class or line range next.
    Use ordinary shell reading when this tool cannot provide the needed content.
    {% endif %}
    Files below 10,000 characters return full content; larger files return signatures.
    --selector takes a name such as is_fits or Calculator.add, not 'def is_fits'.
    --line-start and --line-end read exact 1-based line ranges, including non-code files.
    A directory path can provide an overview or search for a named entity.
    {% endif %}
    {% if env.ACI_TOOL_E == '1' %}
    Editing commands are installed on PATH. Call them through the bash tool.
    {% if env.ACI_TOOL_POLICY == 'tool_first' %}
    Use these editing commands before shell/Python rewrites when they support the change.
    Use ordinary shell editing if these tools cannot express or apply the required change.
    {% endif %}
    - str_replace PATH OLD_TEXT [NEW_TEXT]: small text changes. OLD_TEXT must occur exactly
      once. Omit NEW_TEXT or pass an empty string to delete the matched text.
    - editCode PATH OPERATION SELECTOR [--replacement CODE]: CodeStruct's AST editor with
      its documented UTF-8 offset fix. Use replace_node for whole-function/class rewrites,
      insert_node to add nodes, and delete_node to remove nodes. Selectors include
      functionName, ClassName, ClassName.methodName, start and end.
    - create_file PATH [CONTENT]: create a file and missing parent directories.
      This original command overwrites an existing file; do not use it for a small edit.
    Prefer str_replace for small edits (< 5 lines); editCode is for adding/deleting functions
    or classes and whole-function rewrites (>30% changed), following CodeStruct's guidance.
    Quote all text arguments; bash $'...\n...' supports multiline content.
    Do not include imports already present in the file in an AST replacement.
    Inspect the output and resulting diff: these original CLIs can return exit code zero
    even when they report an error. A zero exit code alone does not confirm an edit.
    Example: editCode main.py replace_node answer --replacement $'def answer():\n    return 42'
    {% endif %}
model:
  cost_tracking: ignore_errors
  model_kwargs:
    api_base: http://127.0.0.1:18002/v1
    seed: 42
environment:
  environment_class: docker
  env:
    ACI_TOOL_S: '0'
    ACI_TOOL_U: '0'
    ACI_U_IMPLEMENTATION: codestruct
    ACI_TOOL_POLICY: optional
    ACI_TOOL_E: '0'
    ACI_TESTS_FILES: '3'
    ACI_TESTS_TIMEOUT: '180'
    ACI_TESTS_CHARS: '1500'
run:
  env_startup_command: |
    set -eu
    git reset --hard {{ base_commit }}
    git clean -fd
    mkdir -p /root/aci-tools
    for tool in /opt/aci-tools/*; do
      [ -d "$tool" ] || continue
      cp -a "$tool" /root/aci-tools/
      uv venv --python 3.12 "/root/aci-tools/${tool##*/}/.venv"
      uv pip install --python "/root/aci-tools/${tool##*/}/.venv/bin/python" -r "$tool/requirements.txt"
      if [ -d "$tool/bin" ]; then ln -s /root/aci-tools/"${tool##*/}"/bin/* /usr/local/bin/; fi
    done
    # SWE-agent bundles (tools/sweagent-*): repeat SWE-agent's install step (sweagent/tools/tools.py
    # _install_commands): chmod +x the upstream bins, then source each upstream install.sh in one
    # shell, in the config's bundle order. Its pip lines are no-ops: the private venv has them.
    for order in /root/aci-tools/*/upstream/ORDER; do
      [ -f "$order" ] || continue
      up="${order%/ORDER}"
      chmod +x "$up"/*/bin/*
      ( set +u
        pip() { :; }
        export PATH="${up%/upstream}/.venv/bin:$(printf '%s:' "$up"/*/bin)$PATH"
        while read -r b; do
          [ -f "$up/$b/install.sh" ] || continue
          cd "$up/$b"
          . "$up/$b/install.sh"
        done < "$order" )
    done
