environment:
  env:
    ACI_TOOL_S: '0'
    ACI_TOOL_U: '1'
    ACI_TOOL_E: '1'
  run_args:
  - --rm
  - --mount
  - type=bind,src=./.cache/aci-bin/uv,target=/usr/local/bin/uv,readonly
  - --mount
  - type=bind,src=./tools/codestruct/reading,target=/opt/aci-tools/understanding,readonly
  - --mount
  - type=bind,src=./tools/codestruct/editing,target=/opt/aci-tools/editing,readonly
