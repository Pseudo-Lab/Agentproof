tools:
  str_replace:
    signature: "str_replace <file_path> <old_str> [<new_str>]"
    docstring: >
      Replace a unique string in a file. Safe tool that never crashes.
      
      WHEN TO USE:
      • Use str_replace ONLY for very small edits (single line changes, simple text replacements)
      • For most code modifications, use editCode tool instead
      • For any function/class modifications, prefer editCode tool
      
      IMPORTANT:
      - old_str must appear EXACTLY ONCE in the file
      - Automatically converts relative paths to absolute
      - Returns error message instead of crashing on failure
      
      Usage:
      - str_replace /path/to/file.py "old text" "new text"
      - str_replace /path/to/file.py "text to delete" ""
      
      The tool will:
      1. Check if file exists
      2. Verify old_str appears exactly once
      3. Perform replacement
      4. Save file
      
      Returns success message or error (never crashes shell).
    arguments:
      - name: file_path
        type: string
        description: Path to file (absolute or relative)
        required: true
      - name: old_str
        type: string
        description: Exact string to replace (must be unique in file)
        required: true
      - name: new_str
        type: string
        description: "Replacement string (default: empty string to delete)"
        required: false
  
  create_file:
    signature: "create_file <file_path> [<content>]"
    docstring: >
      Create a new file with content. Safe tool that never crashes.
      
      IMPORTANT:
      - Use this instead of bash heredoc or inline python to avoid shell crashes
      - Perfect for creating reproduction scripts that might error
      - Automatically creates parent directories
      - Overwrites existing files by default
      
      Usage:
      - create_file reproduce_bug.py "from module import func\nfunc()"
      - create_file test.txt "hello world"
      
      The tool will:
      1. Create parent directories if needed
      2. Write content to file (overwrites if exists)
      3. Return success/error (never crashes shell)
      
      WHY USE THIS:
      When creating reproduction scripts that might crash (e.g., testing bugs),
      use create_file instead of inline python execution. This prevents the
      error from crashing your shell session.
      
      Example workflow:
      1. create_file reproduce_bug.py "code that might crash"
      2. python reproduce_bug.py  # Error contained in subprocess
      3. Fix the bug
      4. python reproduce_bug.py  # Verify fix
    arguments:
      - name: file_path
        type: string
        description: Path to file to create (absolute or relative)
        required: true
      - name: content
        type: string
        description: File content (use quotes for multi-line, default empty)
        required: false
