tools:  
  editCode:
    signature: "editCode <path> <operation> <selector> [<replacement>]"
    docstring: >
      AST-based code editor. Auto-detects language, handles indentation.
      
      PREFER str_replace FOR:
      • Single-line changes or small edits (< 5 lines)
      • Modifying a return statement, condition, or variable
      • Adding/removing a single statement within a function
      • Any change that doesn't require replacing the entire function
      
      USE editCode ONLY FOR:
      • Adding NEW functions or methods (insert_node)
      • Deleting entire functions/classes (delete_node)
      • Complete function rewrites where >30% of lines change
      
      CRITICAL - AVOID THESE MISTAKES:
      • Do NOT include import statements in replacement - they already exist
      • Do NOT use replace_node for small changes - use str_replace instead
      • Do NOT rewrite entire functions to change 1-2 lines
      
      Operations: replace_node, insert_node, delete_node
      Possible Selectors: "ClassName", "functionName", "ClassName.methodName", "start", "end"
      
      Examples:
      • editCode main.py insert_node Calculator --replacement "def add(self, a, b):\n    return a + b"
      • editCode main.py delete_node oldFunc
      • For small edits, use: str_replace file.py "old_line" "new_line"
    arguments:
      - name: path
        type: string
        description: "File path to modify (required)"
        required: true
      - name: operation
        type: string
        description: "AST operation type: replace_node, insert_node, delete_node"
        required: true
      - name: selector
        type: string
        description: "Target selector (required with operation)"
        required: false
      - name: replacement
        type: string
        description: "New code for replace_node/insert_node (use --replacement)"
        required: false
        argument_format: "--replacement {{value}}"
