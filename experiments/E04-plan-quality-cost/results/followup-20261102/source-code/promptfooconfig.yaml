description: Plan-only pilot — high single vs low single vs low ensembles and role-diverse low ensemble
prompts:
  - '{{task}}'
providers:
  - id: file://provider.py
    label: A_high_single
    config:
      group: A
  - id: file://provider.py
    label: B_low_single
    config:
      group: B
  - id: file://provider.py
    label: C_low_ensemble_n3
    config:
      group: C
  - id: file://provider.py
    label: D_low_ensemble_n5
    config:
      group: D
  - id: file://provider.py
    label: E_low_role_diverse_n3
    config:
      group: E
tests: file://cases.json
defaultTest:
  assert:
    - type: python
      value: file://judge.py
      metric: plan_quality
# run.py disables cache and limits outer concurrency to one.
# C/D/E candidate calls run concurrently within each Plan sample.
evaluateOptions:
  maxConcurrency: 1
